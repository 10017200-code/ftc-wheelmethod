plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

application {
    mainClass = 'com.csayer.MotorSystem.FTCMain'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.csayer.MotorSystem.FTCMain'
    }
}